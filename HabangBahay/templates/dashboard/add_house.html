<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add House - HABANGBAHAY</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard/add_house.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <div class="top-bar"></div>

    <div class="form-container">
        <h1>List a House</h1>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="house-form">
            {% csrf_token %}

            <label>Location</label>
            <button type="button" id="gps-btn" class="submit-btn">📍 Use My Current Location</button>

            <script>
                document.getElementById('gps-btn').addEventListener('click', function() {
                    const btn = this;
                    btn.innerText = "📍 Locating..."; // Give user feedback
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            async function(position) {
                                const lat = position.coords.latitude;
                                const lng = position.coords.longitude;

                                    // 1. Update the map (if your package exposes the map instance)
                                    // map.setView([lat, lng], 16); 

                                    // 2. Reverse Geocode: Get the address from the coordinates
                                try {
                                    // Call OpenStreetMap's Nominatim API
                                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                                    if (!response.ok) {
                                        throw new Error('Network response was not ok');
                                    }
                                    const data = await response.json();
                                        // 3. Paste the address into the input field
                                    if (data && data.display_name) {
                                        const addressInput = document.querySelector('input[name="address"]');
                                        if (addressInput) {
                                            addressInput.value = data.display_name;
                                        }
                                    } else {
                                        alert("Location found, but couldn't get the exact street address.");
                                    }
                                } catch (error) {
                                    console.error("Geocoding error:", error);
                                    alert("Failed to get the address. Please type it manually.");
                                } finally {
                                    btn.innerText = "📍 Use My Current Location";
                                }
                            },
                            function(error) {
                                btn.innerText = "📍 Use My Current Location";
                                alert("Unable to get location. Please allow location permissions.");
                            },
                            { enableHighAccuracy: true }
                        );
                    } else {
                        alert("Geolocation is not supported by this browser.");
                    }
                });
            </script>

            <!-- Hidden fields to store GPS coordinates -->
            <input type="hidden" name="latitude" id="latitude" value="">
            <input type="hidden" name="longitude" id="longitude" value="">
            <div id="map" style="height: 300px; width: 100%; margin-bottom: 20px; border-radius: 10px;"></div>            
            <label>Address</label>
            <input type="text" name="address" placeholder="e.g. 123 Main St, City" required>

            <label>Monthly Price (₱)</label>
            <input type="number" step="0.01" name="price" placeholder="e.g. 5000.00" required>

            <label>Number of Rooms</label>
            <input type="number" name="rooms" placeholder="e.g. 3" required>

            <label>Allowed Gender</label>
            <select name="gender" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Any">Any</option>
            </select>

            <label>Description</label>
            <textarea name="description" placeholder="Describe the house, amenities, etc." rows="4" required></textarea>

            <div class="form-actions">
                <a href="{% url 'dashboard:home' %}" class="cancel-btn">Cancel</a>
                <button type="submit" class="submit-btn">Upload House</button>
            </div>
        </form>
    </div>

    <script>
        const map = L.map('map').setView([14.5995, 120.9842], 13); // Default to Manila or your region
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([14.5995, 120.9842], {draggable: true}).addTo(map);
    </script>
</body>
</html>
