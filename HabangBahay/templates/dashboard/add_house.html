<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add House - HABANGBAHAY</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard/add_house.css' %}">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="top-bar"></div>

    <div class="form-container">
        <h1>List a House</h1>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="house-form" id="add-house-form">
            {% csrf_token %}
            
            <!-- ADDRESS INPUT & GPS BUTTON -->
            <label>Address</label>
            <div class="address-group">
                <input type="text" name="address" id="address-input" placeholder="e.g. 123 Main St, City" required>
                <button type="button" id="gps-btn" class="gps-btn" title="Get current location">📍 Auto-Fill via GPS</button>
            </div>

            <!-- MAP CONTAINER -->
            <label>Pin Location on Map</label>
            <div id="map" class="map-container" style="height: 300px; width: 100%;"></div>            
            <!-- HIDDEN INPUTS TO SAVE COORDINATES TO DJANGO -->
            <input type="hidden" name="latitude" id="latitude" value="">
            <input type="hidden" name="longitude" id="longitude" value="">

            <label>Monthly Price (₱)</label>
            <input type="number" step="0.01" name="price" placeholder="e.g. 5000.00" required>

            <label>Number of Rooms</label>
            <input type="number" name="rooms" placeholder="e.g. 3" required>

            <label>Allowed Gender</label>
            <select name="gender" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Any">Any</option>
            </select>

            <label>Description</label>
            <textarea name="description" placeholder="Describe the house, amenities, etc." rows="4" required></textarea>

            <div class="form-actions">
                <a href="{% url 'dashboard:home' %}" class="cancel-btn">Cancel</a>
                <button type="submit" class="submit-btn">Upload House</button>
            </div>
        </form>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>    
    <script>
        // 1. Initialize the Map (Default center: Manila)
        const defaultLat = 14.5995;
        const defaultLng = 120.9842;
        
        const map = L.map('map').setView([defaultLat, defaultLng], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 2. Add a draggable marker
        const marker = L.marker([defaultLat, defaultLng], {draggable: true}).addTo(map);

        // --- NEW REUSABLE FUNCTION: Reverse Geocode ---
        async function updateAddressFromCoords(lat, lng) {
            const addressInput = document.getElementById('address-input');
            const originalValue = addressInput.value;
            
            // Optional: Show a loading state
            addressInput.value = "Fetching address...";

            try {
                // Added a custom email to respect Nominatim usage policy and avoid blocks
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&email=your_email@example.com`);
                const data = await response.json();
                
                if (data && data.display_name) {
                    addressInput.value = data.display_name;
                } else {
                    // If no address found (e.g., middle of the ocean)
                    addressInput.value = originalValue; 
                    // alert("No address found for this exact location.");
                }
            } catch (error) {
                console.error("Error fetching address:", error);
                addressInput.value = originalValue;
            }
        }

        // 3. Update address when marker is dragged
        marker.on('dragend', function (e) {
            const position = marker.getLatLng();
            document.getElementById('latitude').value = position.lat;
            document.getElementById('longitude').value = position.lng;
            
            // Trigger address update
            updateAddressFromCoords(position.lat, position.lng);
        });

        // 4. Update address when map is clicked
        map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            document.getElementById('latitude').value = e.latlng.lat;
            document.getElementById('longitude').value = e.latlng.lng;
            
            // Trigger address update
            updateAddressFromCoords(e.latlng.lat, e.latlng.lng);
        });

        // 5. GPS Auto-Fill Logic
        document.getElementById('gps-btn').addEventListener('click', function() {
            const btn = this;
            btn.innerText = "📍 Locating...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Move map and marker
                        map.setView([lat, lng], 16);
                        marker.setLatLng([lat, lng]);
                        
                        // Save to hidden inputs
                        document.getElementById('latitude').value = lat;
                        document.getElementById('longitude').value = lng;

                        // Call the reusable function
                        updateAddressFromCoords(lat, lng);
                        
                        btn.innerText = "📍 Auto-Fill via GPS";
                    },
                    function(error) {
                        btn.innerText = "📍 Auto-Fill via GPS";
                        alert("Unable to get location. Please allow location permissions.");
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        });
    </script>
</body>
</html>
