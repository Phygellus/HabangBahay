<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add House - HABANGBAHAY</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard/add_house.css' %}">
</head>
<body>
    <div class="top-bar"></div>

    <div class="form-container">
        <h1>List a House</h1>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="house-form">
            {% csrf_token %}
            
            <label>Address</label>
            <input type="text" name="address" placeholder="e.g. 123 Main St, City" required>

            <label>Monthly Price (₱)</label>
            <input type="number" step="0.01" name="price" placeholder="e.g. 5000.00" required>

            <label>Number of Rooms</label>
            <input type="number" name="rooms" placeholder="e.g. 3" required>

            <label>Allowed Gender</label>
            <select name="gender" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Any">Any</option>
            </select>

            <label>Description</label>
            <textarea name="description" placeholder="Describe the house, amenities, etc." rows="4" required></textarea>

            <div class="form-actions">
                <a href="{% url 'dashboard:home' %}" class="cancel-btn">Cancel</a>
                <button type="submit" class="submit-btn">Upload House</button>
            </div>
        </form>
    </div>
</body>
</html>
