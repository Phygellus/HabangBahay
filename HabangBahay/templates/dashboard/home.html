<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABANGBAHAY - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #e5dbd0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            position: relative;
        }
        h1 {
            margin-top: 32px;
            margin-left: 39px;
            font-size: 60px;
            font-weight: bold;
            color: #403329;
        }
        .username {
            color: #5a4738;
        }
        .messages {
            margin: 20px 39px;
            width: auto;
            max-width: 500px;
        }
        .alert {
            padding: 15px 20px;
            border-radius: 35px;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .logout-button {
            position: absolute;
            top: 501px;
            left: 50%;
            transform: translateX(-50%);
            width: 207px;
            height: 74px;
            border: none;
            border-radius: 38px;
            background-color: #403329;
            color: white;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
        }
        .logout-button:hover {
            background-color: #514238;
        }
        @media (max-width: 600px) {
            h1 {
                margin-left: 25px;
                margin-top: 30px;
                font-size: 40px;
            }
            .messages {
                margin: 20px 25px;
            }
            .logout-button {
                top: 50%;
                width: 190px;
                height: 60px;
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <h1>Welcome, <span class="username">{{ username }}</span></h1>
    <div class="sidebar-menu">
        <a href="{% url 'prof:home' %}">Profile</a>
        <a href="#">Preferences</a>
        <a href="{% url 'settings:home' %}">Settings</a>
        <a href="{% url 'dashboard:logout' %}">Logout</a>
    </div>
    <form method="POST" action="{% url 'dashboard:logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-button">Log Out</button>
    </form>
</body>
</html>
